# ========================================
# Production Profile - Database Configuration
# ========================================

# MySQL Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/midoritei?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ========================================
# JPA/Hibernate Configuration (Production)
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================
# Logging Configuration (Production)
# ========================================
logging.level.root=WARN
logging.level.com.example.midoritei=INFO

# ========================================
# Thymeleaf Cache (Production)
# ========================================
spring.thymeleaf.cache=true
