# ========================================
# Production Profile - MariaDB Database Configuration
# ========================================

# MariaDB Database connection
spring.datasource.url=jdbc:mariadb://localhost:3306/midoritei?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=mariadb
# SQL初期化設定（起動時にMariaDB用のスキーマファイルを実行してテーブルを自動作成）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mariadb.sql

# H2 Console無効化
spring.h2.console.enabled=false

# ========================================
# JPA/Hibernate Configuration (Production - MariaDB)
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ========================================
# Logging Configuration (Production)
# ========================================
logging.level.root=WARN
logging.level.com.example.midoritei=INFO

# ========================================
# Thymeleaf Cache (Production)
# ========================================
spring.thymeleaf.cache=true
