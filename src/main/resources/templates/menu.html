<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどり亭 - 注文</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding-bottom: 140px;
            background-color: #f9f9f9;
        }

        header {
            background-color: #fff;
            border-bottom: 3px solid #f3b123;
            padding: 10px 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
        }

        .home-btn {
            color: #f3b123;
            font-size: 28px;
            text-decoration: none;
            position: absolute;
            left: 15px;
            z-index: 101;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: #333;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .timer {
            font-size: 14px;
            text-align: right;
            color: #333;
            position: absolute;
            right: 15px;
            z-index: 101;
            line-height: 1.3;
        }

        .category-tabs {
            background-color: #fff;
            display: flex;
            overflow-x: auto;
            padding: 10px;
            gap: 10px;
            border-bottom: 1px solid #eee;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 5px 15px;
            font-size: 16px;
            color: #666;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
            border-radius: 20px;
            border: 1px solid #ccc;
        }

        .tab-btn.active {
            color: #fff;
            background-color: #f3b123;
            border-color: #f3b123;
            font-weight: bold;
        }

        .menu-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 18px;
            margin: 0 0 10px 0;
            color: #333;
            font-weight: bold;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .product-img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            margin-left: 15px;
            background-color: #eee;
        }

        .cart-footer {
            position: fixed;
            bottom: 60px;
            left: 0;
            width: 100%;
            background-color: #fff;
            border-top: 1px solid #ccc;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 90;
        }

        .total-price {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .view-cart-btn {
            background-color: #f3b123;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #fff;
            border-top: 2px solid #f3b123;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            text-align: center;
            color: #666;
            text-decoration: none;
            width: 33.3%;
        }

        .nav-item.active {
            color: #f3b123;
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-text {
            font-size: 12px;
            margin-top: 3px;
            font-weight: bold;
        }
    </style>

    <div th:replace="~{fragments :: nav-styles}"></div>

</head>

<body>
    <header>
        <a th:href="@{/menu}" class="home-btn"><i class="fas fa-home"></i></a>
        <h1>注文</h1>
        <div class="timer">残り時間<br><strong id="countdown-timer">01:20:00</strong></div>
    </header>

    <div class="category-tabs">
        <a th:each="cat : ${categories}" 
           th:href="@{/menu(categoryId=${cat.category_id})}" 
           th:classappend="${cat.category_id == currentCategoryId} ? 'active' : ''" 
           class="tab-btn" 
           th:text="${cat.category_name}">
           カテゴリー名
        </a>
    </div>

    <div class="menu-list">
        <a th:href="@{/menu/detail/{id}(id=${p.productId})}" class="product-card" th:each="p : ${products}">
            <div class="product-info">
                <h3 class="product-name" th:text="${p.productName}">商品名</h3>
                
                <div class="product-price">
                    <span th:if="${p.includedInCourse}" 
                        style="color: #28a745; font-weight: bold; background-color: #e8f5e9; padding: 2px 8px; border-radius: 4px; font-size: 16px;">
                        0円 (コース込)
                    </span>

                    <span th:unless="${p.includedInCourse}" th:text="${p.price} + '円(税込)'">
                             0円(税込)
                    </span>
                    </span>
                </div>
            </div>
            <img th:src="${p.imagePath}" class="product-img" alt="商品画像">
        </a>
    </div>

    <div class="cart-footer">
        <div class="total-price">小計 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span th:text="${#numbers.formatInteger(totalAmount, 3, 'COMMA')}">0</span> 円(税込)</div>
        <a th:href="@{/cart}" class="view-cart-btn">カゴを見る（<span th:text="${cartCount}">0</span>）</a>
    </div>

    <div th:replace="~{fragments :: bottom-nav('menu')}"></div>

</body>
<script>
    // 1. ページが読み込まれた瞬間に、現在のURLを履歴の「最前列」にセットする
    // これにより、「戻る」ボタンを押したときの遷移先が「現在のページ」自身になります
    history.pushState(null, null, location.href);

    // 2. ブラウザの戻る操作(popstate)を検知して割り込む
    window.addEventListener('popstate', function(event) {
        // 再度履歴を現在のURLで上書きする（戻るのを防ぐ）
        history.pushState(null, null, location.href);
        
        // 3. 強制リロードを実行
        // リロードすることで、サーバー側のインターセプター（門番）が再起動し、
        // 「注文中ならメニュー画面に戻す」というサーバー側のルールを確実に実行させる
        window.location.reload(); 
    });
</script>

<div th:replace="~{fragments :: timer-script}"></div>
</html>
