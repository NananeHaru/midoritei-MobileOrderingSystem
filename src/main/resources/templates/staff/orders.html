<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文一覧 | みどり亭 スタッフ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #E29A13;
            --primary-hover: #C5830E;
            --bg-color: #F4F5F7;
            --sidebar-bg: #EFEFEF;
            --card-green: #00A854;
            --card-red: #F04134;
            --text-color: #333333;
            --border-color: #DDDDDD;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background-color: #FFFFFF;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 4px solid var(--primary-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary-color);
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--primary-hover);
        }

        /* メインレイアウト */
        .main-container {
            display: flex;
            margin-top: 60px;
            flex: 1;
        }

        /* サイドバー */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            padding-top: 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            color: #555555;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            border-left: 4px solid transparent;
            font-size: 1.05rem;
        }

        .menu-item:hover {
            background-color: rgba(0,0,0,0.03);
            color: #111111;
        }

        .menu-item.active {
            background-color: #FFFFFF;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            font-weight: 700;
        }

        .menu-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* コンテンツ領域 */
        .content {
            margin-left: 240px;
            padding: 30px;
            flex: 1;
            max-width: calc(100% - 240px);
        }

        /* 提供状況カード */
        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            flex: 1;
            border-radius: 8px;
            padding: 15px 25px;
            color: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .stat-card.green {
            background-color: var(--card-green);
        }

        .stat-card.red {
            background-color: var(--card-red);
        }

        .stat-label {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-value span {
            font-size: 1.3rem;
            font-weight: 500;
            margin-left: 5px;
        }

        /* 注文一覧エリア */
        .order-section {
            background-color: #FFFFFF;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .order-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111111;
        }

        /* フィルター・更新ボタン */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .date-input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            color: #333333;
        }

        .date-input:focus {
            border-color: var(--primary-color);
        }

        .btn-update {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-update:hover {
            background-color: var(--primary-hover);
        }

        /* テーブル */
        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
        }

        .order-table th {
            background-color: var(--primary-color);
            color: #FFFFFF;
            padding: 12px 15px;
            font-weight: 700;
            font-size: 1rem;
            border: 1px solid var(--border-color);
        }

        .order-table td {
            padding: 14px 15px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .order-table tr:nth-child(even) {
            background-color: #F9F9F9;
        }

        .order-table tr:hover {
            background-color: #F1F1F1;
        }

        /* 提供状況ボタン */
        .status-form {
            display: inline;
        }

        .btn-status {
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-status:hover {
            opacity: 0.9;
        }

        .btn-status:active {
            transform: scale(0.95);
        }

        .btn-status.cooking {
            background-color: #FFEBEA;
            color: var(--card-red);
            border: 1px solid var(--card-red);
        }

        .btn-status.served {
            background-color: #E6F7F0;
            color: var(--card-green);
            border: 1px solid var(--card-green);
        }
    </style>
</head>
<body>

<!-- ヘッダー -->
<header class="header">
    <a th:href="@{/staff/orders}" class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
    </a>
    <a th:href="@{/staff/logout}" class="btn-logout">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        ログアウト
    </a>
</header>

<div class="main-container">
    <!-- サイドバー -->
    <aside class="sidebar">
        <a th:href="@{/staff/orders}" class="menu-item active">
            <span class="menu-icon">
                <!-- 注文一覧：帳票アイコン -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </span>
            注文一覧
        </a>
        <a th:href="@{/staff/orders/add}" class="menu-item">
            <span class="menu-icon">
                <!-- 注文追加：+ -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </span>
            注文追加
        </a>
        <a th:href="@{/staff/orders/delete}" class="menu-item">
            <span class="menu-icon">
                <!-- 注文削除：- -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </span>
            注文削除
        </a>
        <a href="#" class="menu-item" onclick="alert('メニュー管理は準備中です')">
            <span class="menu-icon">
                <!-- メニュー管理：スプーン＆フォーク -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </span>
            メニュー管理
        </a>
        <a href="#" class="menu-item" onclick="alert('座席一覧は準備中です')">
            <span class="menu-icon">
                <!-- 座席一覧：テーブル -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="9" x2="15" y2="9"></line>
                    <line x1="9" y1="13" x2="15" y2="13"></line>
                    <line x1="9" y1="17" x2="15" y2="17"></line>
                </svg>
            </span>
            座席一覧
        </a>
    </aside>

    <!-- コンテンツ -->
    <main class="content">
        <!-- 提供状況カード -->
        <div class="stats-container">
            <div class="stat-card green">
                <div class="stat-label">提供済</div>
                <div class="stat-value" th:text="${stats.paid_count}">0<span>品</span></div>
            </div>
            <div class="stat-card red">
                <div class="stat-label">未提供</div>
                <div class="stat-value" th:text="${stats.unpaid_count}">0<span>品</span></div>
            </div>
        </div>

        <!-- 注文一覧 -->
        <div class="order-section">
            <div class="order-header">
                <h2 class="order-title">注文一覧</h2>
                <!-- 日付フィルター -->
                <form th:action="@{/staff/orders}" method="GET" class="filter-bar">
                    <div class="date-input-wrapper">
                        <input type="date" name="date" class="date-input" th:value="${selectedDate}">
                    </div>
                    <button type="submit" class="btn-update">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                        </svg>
                        更新
                    </button>
                </form>
            </div>

            <!-- テーブル -->
            <table class="order-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">座席ID</th>
                        <th style="width: 15%;">注文ID</th>
                        <th style="width: 40%;">品名</th>
                        <th style="width: 10%;">数量</th>
                        <th style="width: 20%;">提供状況</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orderDetails}">
                        <!-- 座席ID -->
                        <td th:text="${order.seat_id}">-</td>
                        <!-- 注文ID -->
                        <td th:text="${order.order_id}">-</td>
                        <!-- 品名 (オプション付きなら括弧で表示) -->
                        <td>
                            <span th:text="${order.product_name}">商品名</span>
                            <small th:if="${order.option_info != null && order.option_info != ''}"
                                   th:text="'（' + ${order.option_info} + '）'" 
                                   style="color: #666; font-style: italic;">(オプション)
                            </small>
                        </td>
                        <!-- 数量 -->
                        <td th:text="${order.quantity}">0</td>
                        <!-- 提供状況 (タップでステータス変更) -->
                        <td>
                            <!-- 調理中（未提供: 0）の場合、クリックで提供済にする -->
                            <form th:if="${order.order_status == 0}" th:action="@{/staff/orders/status}" method="POST" class="status-form">
                                <input type="hidden" name="orderItemId" th:value="${order.order_detail_id}">
                                <input type="hidden" name="status" value="1">
                                <input type="hidden" name="date" th:value="${selectedDate}">
                                <button type="submit" class="btn-status cooking">調理中</button>
                            </form>
                            <!-- 提供済: 1 の場合、クリックで調理中に戻す -->
                            <form th:if="${order.order_status == 1}" th:action="@{/staff/orders/status}" method="POST" class="status-form">
                                <input type="hidden" name="orderItemId" th:value="${order.order_detail_id}">
                                <input type="hidden" name="status" value="0">
                                <input type="hidden" name="date" th:value="${selectedDate}">
                                <button type="submit" class="btn-status served">提供済</button>
                            </form>
                        </td>
                    </tr>
                    <!-- 注文データがない場合 -->
                    <tr th:if="${#lists.isEmpty(orderDetails)}">
                        <td colspan="5" style="text-align: center; color: #888; padding: 30px;">
                            指定された日付の注文データはありません。
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
