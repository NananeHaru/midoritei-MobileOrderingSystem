<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー管理 | みどり亭 スタッフ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #E29A13;
            --primary-hover: #C5830E;
            --bg-color: #F4F5F7;
            --sidebar-bg: #EFEFEF;
            --text-color: #333333;
            --border-color: #DDDDDD;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background-color: #FFFFFF;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 4px solid var(--primary-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary-color);
        }

        .header-logo span {
            font-size: 1.25rem;
            font-weight: 700;
            margin-left: 10px;
            font-family: 'Noto Serif JP', serif;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--primary-hover);
        }

        /* メインレイアウト */
        .main-container {
            display: flex;
            margin-top: 60px;
            flex: 1;
        }

        /* サイドバー */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            padding-top: 10px;
            z-index: 90;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            color: #555555;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            border-left: 4px solid transparent;
            font-size: 1.05rem;
        }

        .menu-item:hover {
            background-color: rgba(0,0,0,0.03);
            color: #111111;
        }

        .menu-item.active {
            background-color: #FFFFFF;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            font-weight: 700;
        }

        .menu-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* コンテンツ領域 */
        .content {
            margin-left: 240px;
            padding: 30px;
            flex: 1;
            max-width: calc(100% - 240px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        /* 大きな選択ボタン */
        .btn-large {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 480px;
            height: 120px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(226, 154, 19, 0.2);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .btn-large:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(226, 154, 19, 0.3);
        }

        .btn-large-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
        }

        /* 完了トースト/ダイアログ用（メニュー追加完了時などに自動表示） */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #FFFFFF;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            padding: 30px;
            text-align: center;
        }

        .modal-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .btn-confirm {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-confirm:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <a th:href="@{/staff/orders}" class="header-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>みどり亭</span>
        </a>
        <a th:href="@{/staff/logout}" class="btn-logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            ログアウト
        </a>
    </header>

    <div class="main-container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <a th:href="@{/staff/orders}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="15" y2="17"></line>
                    </svg>
                </span>
                注文一覧
            </a>
            <a th:href="@{/staff/orders/add}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文追加
            </a>
            <a th:href="@{/staff/orders/delete}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文削除
            </a>
            <a th:href="@{/staff/menu}" class="menu-item active">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </span>
                メニュー管理
            </a>
            <a th:href="@{/staff/seating}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19h16v2H4zM4 5h16v12H4z"></path>
                    </svg>
                </span>
                座席一覧
            </a>
        </aside>

        <!-- メインコンテンツ -->
        <main class="content">
            <!-- メニュー検索ボタン -->
            <a th:href="@{/staff/menu/search}" class="btn-large">
                <span class="btn-large-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                メニュー検索
            </a>

            <!-- メニュー追加ボタン -->
            <a th:href="@{/staff/menu/add}" class="btn-large">
                <span class="btn-large-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                メニュー追加
            </a>
        </main>
    </div>

    <!-- メニュー追加完了ダイアログ -->
    <div class="modal-overlay" id="addCompleteModal" th:style="${addComplete} ? 'display: flex;' : 'display: none;'">
        <div class="modal-card">
            <h3 class="modal-title">メニューの追加が完了しました</h3>
            <p style="margin-bottom: 24px; font-size: 1.1rem; font-weight: 500;" th:text="${addedProductName}"></p>
            <button type="button" class="btn-confirm" onclick="closeCompleteModal()">確認</button>
        </div>
    </div>

    <script th:inline="javascript">
        function closeCompleteModal() {
            document.getElementById('addCompleteModal').style.display = 'none';
        }
    </script>
</body>
</html>
