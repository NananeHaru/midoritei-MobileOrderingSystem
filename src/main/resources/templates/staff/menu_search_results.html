<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー検索結果 | みどり亭 スタッフ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #E29A13;
            --primary-hover: #C5830E;
            --bg-color: #F4F5F7;
            --sidebar-bg: #EFEFEF;
            --text-color: #333333;
            --border-color: #DDDDDD;
            --card-green: #00A854;
            --card-red: #F04134;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background-color: #FFFFFF;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 4px solid var(--primary-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary-color);
        }

        .header-logo span {
            font-size: 1.25rem;
            font-weight: 700;
            margin-left: 10px;
            font-family: 'Noto Serif JP', serif;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--primary-hover);
        }

        /* メインレイアウト */
        .main-container {
            display: flex;
            margin-top: 60px;
            flex: 1;
        }

        /* サイドバー */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            padding-top: 10px;
            z-index: 90;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            color: #555555;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            border-left: 4px solid transparent;
            font-size: 1.05rem;
        }

        .menu-item:hover {
            background-color: rgba(0,0,0,0.03);
            color: #111111;
        }

        .menu-item.active {
            background-color: #FFFFFF;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            font-weight: 700;
        }

        .menu-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* コンテンツ領域 */
        .content {
            margin-left: 240px;
            padding: 30px;
            flex: 1;
            max-width: calc(100% - 240px);
        }

        /* コンテンツヘッダー */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            width: 44px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .btn-back:hover {
            background-color: var(--primary-hover);
        }

        /* 検索に戻るボタン */
        .btn-search-form {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-search-form:hover {
            background-color: var(--primary-hover);
        }

        /* 検索結果コンテナ */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .product-card {
            background-color: #FFFFFF;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);
        }

        .product-info {
            flex: 1;
            /* 💡 追加：画面が狭くなったときに、このエリアが適切に縮むようにして、
                     右側のボタンや画像スペースを押し潰すのを防ぎます */
            min-width: 0; 
        }

        .product-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-price {
            font-size: 1.15rem;
            color: #555555;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .product-status {
            font-size: 0.95rem;
            font-weight: 500;
            color: #777777;
            display: flex;
            align-items: center;
        }

        .status-tag {
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            font-size: 0.85rem;
        }

        .status-tag.active {
            color: var(--card-green);
            background-color: rgba(0, 168, 84, 0.08);
            border: 1px solid var(--card-green);
        }

        .status-tag.inactive {
            color: var(--card-red);
            background-color: rgba(240, 65, 52, 0.08);
            border: 1px solid var(--card-red);
        }

        .status-tag.suspended {
            color: #777777;
            background-color: rgba(119, 119, 119, 0.08);
            border: 1px solid #777777;
        }

        .btn-detail {
          background-color: var(--primary-color);
          color: #FFFFFF;
          border: none;
          border-radius: 6px;
          padding: 10px 20px;       /* 💡 左右の余白を少し調整 */
          font-size: 0.95rem;
          font-weight: 700;
          cursor: pointer;
          text-decoration: none;
          transition: background-color 0.2s;

          /* 🛠️ ここから追加：絶対に潰さないための設定 */
          white-space: nowrap;      /* 文字の自動改行を禁止 */
          flex-shrink: 0;           /* 親要素の縮小指示を無視する */
          min-width: 80px;          /* 最低でも80pxの横幅を確保する */
          text-align: center;       /* 文字を中央に揃える */
          display: inline-block;    /* サイズを正しく反映させる */
      }

        .btn-detail:hover {
            background-color: var(--primary-hover);
        }

        .product-image-container {
          width: 140px;
          height: 100px;
          border-radius: 6px;
          overflow: hidden;
          border: 1px solid var(--border-color);
          background-color: #FAFAFA;
          margin-left: 24px;
          display: flex;
          align-items: center;
          justify-content: center;

          /* 🛠️ ここから追加 */
          flex-shrink: 0;           /* 枠自体が縮むのを完全に禁止する */
      }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .no-results {
            text-align: center;
            padding: 60px;
            color: #888888;
            background-color: #FFFFFF;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1.1rem;
        }

        /* 💡 追加：詳細ボタンと画像コンテナが入っている右側エリア用のスタイル */
        .product-action-area {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0; /* 💡 右側のボタンと画像を、左側のテキストから絶対に押し潰されないように固定します */
        }

    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <a th:href="@{/staff/orders}" class="header-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>みどり亭 <span style="font-size: 0.95rem; font-weight: 500; opacity: 0.85;" th:text="${session?.loggedInStoreName != null ? '[' + session?.loggedInStoreName + ']' : ''}"></span></span>
        </a>
        <a th:href="@{/staff/logout}" class="btn-logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            ログアウト
        </a>
    </header>

    <div class="main-container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <a th:href="@{/staff/orders}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="15" y2="17"></line>
                    </svg>
                </span>
                注文一覧
            </a>
            <a th:href="@{/staff/orders/add}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文追加
            </a>
            <a th:href="@{/staff/orders/delete}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文削除
            </a>
            <a th:href="@{/staff/menu}" class="menu-item active">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </span>
                メニュー管理
            </a>
            <a th:href="@{/staff/seating}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19h16v2H4zM4 5h16v12H4z"></path>
                    </svg>
                </span>
                座席一覧
            </a>
        </aside>

        <!-- メインコンテンツ -->
        <main class="content">
            <div class="content-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <a th:href="@{/staff/menu/search}" class="btn-back">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </a>
                    <h1 class="content-title">メニュー検索</h1>
                </div>
            </div>
                
                <a th:href="@{/staff/menu/search}" class="btn-search-form">検索</a>
            </div>

            <!-- 検索結果一覧 -->
            <div class="results-container">
                <div class="product-card" th:each="p : ${products}">
                    <div class="product-info">
                        <h2 class="product-title">
                            <span th:text="${p.productName}">やきとり</span>
                            <span th:if="${p.isSeasonal == 1}" style="font-size: 0.8rem; background-color: var(--primary-color); color: white; padding: 2px 6px; border-radius: 3px; font-weight: 700; margin-left: 8px;">季節限定</span>
                        </h2>
                        <p class="product-price" th:text="${p.price} + '円(税込)'">550円(税込)</p>
                        <div class="product-status">
                            <span>状態：</span>
                            <span class="status-tag active" th:if="${p.salesStatus == 0}">販売中</span>
                            <span class="status-tag inactive" th:if="${p.salesStatus == 1}">品切れ</span>
                            <span class="status-tag suspended" th:if="${p.salesStatus == 2}">販売停止中</span>
                        </div>
                    </div>
                    <div class="product-action-area">
                        <a th:href="@{/staff/menu/detail/{id}(id=${p.productId})}" class="btn-detail">詳細</a>
                        <div class="product-image-container" style="margin-left: 0;">
                            <img class="product-image" th:src="${p.imagePath}" alt="商品画像" onerror="this.src='/images/no-image.png'">
                        </div>
                    </div>
                </div>

                <div class="no-results" th:if="${#lists.isEmpty(products)}">
                    検索条件に一致するメニューが見つかりませんでした。
                </div>
            </div>
        </main>
    </div>
</body>
</html>
