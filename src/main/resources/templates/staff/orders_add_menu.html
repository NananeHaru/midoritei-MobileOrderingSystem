<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文追加 - メニュー選択 | みどり亭 スタッフ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #E29A13;
            --primary-hover: #C5830E;
            --bg-color: #F4F5F7;
            --sidebar-bg: #EFEFEF;
            --text-color: #333333;
            --border-color: #DDDDDD;
            --modal-bg: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background-color: #FFFFFF;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 4px solid var(--primary-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary-color);
        }

        .header-logo span {
            font-size: 1.25rem;
            font-weight: 700;
            margin-left: 10px;
            font-family: 'Noto Serif JP', serif;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--primary-hover);
        }

        /* メインレイアウト */
        .main-container {
            display: flex;
            margin-top: 60px;
            flex: 1;
        }

        /* サイドバー */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            padding-top: 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            color: #555555;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            border-left: 4px solid transparent;
            font-size: 1.05rem;
        }

        .menu-item:hover {
            background-color: rgba(0,0,0,0.03);
            color: #111111;
        }

        .menu-item.active {
            background-color: #FFFFFF;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            font-weight: 700;
        }

        .menu-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* コンテンツ領域 */
        .content {
            margin-left: 240px;
            padding: 20px;
            flex: 1;
            max-width: calc(100% - 240px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 上部操作ナビゲーション */
        .action-nav {
            background-color: #FFFFFF;
            border-radius: 8px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }

        .btn-back {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: var(--primary-hover);
        }

        .info-pill {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            gap: 15px;
        }

        .info-pill span {
            color: var(--primary-color);
        }

        .btn-cart {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-cart:hover {
            background-color: var(--primary-hover);
        }

        /* メニューエリア (左カテゴリ、右商品) */
        .menu-workspace {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .category-sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .category-tab {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            color: #555555;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .category-tab:hover {
            background-color: #FAFAFA;
            color: #111111;
        }

        .category-tab.active {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border-color: var(--primary-color);
        }

        .product-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            align-content: start;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
            padding-right: 5px;
        }

        .product-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
            border-color: var(--primary-color);
        }

        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #111111;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #444444;
        }

        .product-img {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #EEEEEE;
            margin-left: 15px;
        }

        /* モーダル共通スタイル */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            text-align: center;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #111111;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn-modal {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: opacity 0.2s;
        }

        .btn-modal:hover {
            opacity: 0.9;
        }

        .btn-modal.cancel {
            background-color: #888888;
            color: #FFFFFF;
        }

        .btn-modal.confirm {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        /* 商品詳細・個数選択ダイアログ用 */
        .detail-modal-content {
            max-width: 600px;
        }

        .detail-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #EEEEEE;
            margin-bottom: 20px;
        }

        .detail-desc {
            color: #666666;
            margin: 15px 0 25px 0;
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .qty-picker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .btn-qty {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            background-color: #FFFFFF;
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-qty:hover {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        .qty-val {
            font-size: 1.8rem;
            font-weight: 700;
            width: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- ヘッダー -->
<header class="header">
    <a th:href="@{/staff/orders}" class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>みどり亭 <span style="font-size: 0.95rem; font-weight: 500; opacity: 0.85;" th:text="${session?.loggedInStoreName != null ? '[' + session?.loggedInStoreName + ']' : ''}"></span></span>
    </a>
    <a th:href="@{/staff/logout}" class="btn-logout">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        ログアウト
    </a>
</header>

<div class="main-container">
    <!-- サイドバー -->
    <aside class="sidebar">
        <a th:href="@{/staff/orders}" class="menu-item">
            <span class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </span>
            注文一覧
        </a>
        <a th:href="@{/staff/orders/add}" class="menu-item active">
            <span class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </span>
            注文追加
        </a>
        <a th:href="@{/staff/orders/delete}" class="menu-item">
            <span class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </span>
            注文削除
        </a>
        <a th:href="@{/staff/menu}" class="menu-item">
            <span class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </span>
            メニュー管理
        </a>
        <a th:href="@{/staff/seating}" class="menu-item">
            <span class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="9" x2="15" y2="9"></line>
                    <line x1="9" y1="13" x2="15" y2="13"></line>
                    <line x1="9" y1="17" x2="15" y2="17"></line>
                </svg>
            </span>
            座席一覧
        </a>
    </aside>

    <!-- コンテンツ -->
    <main class="content">
        <!-- 上部操作バー -->
        <div class="action-nav">
            <button class="btn-back" id="backBtn">
                <!-- 左矢印 -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div class="info-pill">
                <div>座席ID <span th:text="${seatId}">-</span></div>
                <div>選択コース <span th:text="${courseName}">-</span></div>
                <div>小計 <span th:text="${#numbers.formatInteger(totalAmount, 3, 'COMMA')} + ' 円'">0 円</span></div>
            </div>
            <a th:href="@{/staff/orders/add/cart}" class="btn-cart">カゴを見る</a>
        </div>

        <!-- メニューワークスペース -->
        <div class="menu-workspace">
            <!-- カテゴリタブ -->
            <div class="category-sidebar">
                <div class="category-tab active" onclick="filterCategory('all', this)">おすすめ</div>
                <div class="category-tab" onclick="filterCategory('CT01', this)">お酒</div>
                <div class="category-tab" onclick="filterCategory('CT02', this)">一品料理</div>
            </div>

            <!-- 商品グリッド -->
            <div class="product-grid">
                <div class="product-card" th:each="p : ${products}" th:data-category="${p.categoryId}"
                     th:onclick="openDetailModal([[${p.productId}]], [[${p.productName}]], [[${p.price}]], [[${p.imagePath}]], [[${p.categoryId}]], [[${p.description}]])">
                    <div class="product-info">
                        <h3 class="product-name" th:text="${p.productName}">商品名</h3>
                        <span class="product-price" th:text="${p.price} + '円(税込)'">0円</span>
                    </div>
                    <img class="product-img" th:src="${p.imagePath}" alt="商品画像" onerror="this.src='/images/no-image.png'">
                </div>
            </div>
        </div>
    </main>
</div>

<!-- モーダル1: 戻る確認モーダル -->
<div class="modal" id="backModal">
    <div class="modal-content">
        <h3 class="modal-title">座席選択画面に戻りますか？<br>(カゴの内容は破棄されます)</h3>
        <div class="modal-buttons">
            <a th:href="@{/staff/orders/add}" class="btn-modal cancel" style="text-align:center; text-decoration:none; line-height:22px;">戻る</a>
            <button class="btn-modal confirm" id="closeBackModalBtn">続ける</button>
        </div>
    </div>
</div>

<!-- モーダル2: 個数選択・詳細モーダル -->
<div class="modal" id="detailModal">
    <div class="modal-content detail-modal-content">
        <h3 class="modal-title" id="mProductName">商品名</h3>
        <p class="product-price" id="mProductPrice">0円(税込)</p>
        <img class="detail-img" id="mProductImg" src="/images/no-image.png" alt="商品画像" onerror="this.src='/images/no-image.png'">
        <p class="detail-desc" id="mProductDesc">おいしいメニューです。</p>
        
        <form th:action="@{/staff/orders/add/cart/add}" method="POST" id="addToCartForm">
            <input type="hidden" name="productId" id="mProductId">
            <input type="hidden" name="selectedOption" id="mSelectedOption" value="">
            <input type="hidden" name="optionAddPrice" id="mOptionAddPrice" value="0">
            
            <div id="mProductOptions" style="margin: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <!-- Dynamically loaded option buttons -->
            </div>

            <div class="qty-picker">
                <button type="button" class="btn-qty" onclick="changeQty(-1)">-</button>
                <div class="qty-val" id="qtyVal">1</div>
                <input type="hidden" name="quantity" id="qtyInput" value="1">
                <button type="button" class="btn-qty" onclick="changeQty(1)">+</button>
            </div>
            
            <div class="modal-buttons">
                <button type="button" class="btn-modal cancel" onclick="closeDetailModal()">戻る</button>
                <button type="submit" class="btn-modal confirm">カゴに入れる</button>
            </div>
        </form>
    </div>
</div>

<script>
    // カテゴリフィルター
    function filterCategory(categoryId, element) {
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        element.classList.add('active');

        document.querySelectorAll('.product-card').forEach(card => {
            if (categoryId === 'all') {
                card.style.display = 'flex';
            } else {
                if (card.getAttribute('data-category') === categoryId) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            }
        });
    }

    // 戻るモーダルの制御
    const backBtn = document.getElementById('backBtn');
    const backModal = document.getElementById('backModal');
    const closeBackModalBtn = document.getElementById('closeBackModalBtn');

    backBtn.addEventListener('click', () => {
        backModal.style.display = 'flex';
    });

    closeBackModalBtn.addEventListener('click', () => {
        backModal.style.display = 'none';
    });

    // 詳細モーダルの制御
    const detailModal = document.getElementById('detailModal');
    const mProductId = document.getElementById('mProductId');
    const mProductName = document.getElementById('mProductName');
    const mProductPrice = document.getElementById('mProductPrice');
    const mProductImg = document.getElementById('mProductImg');
    const mProductDesc = document.getElementById('mProductDesc');
    const qtyVal = document.getElementById('qtyVal');
    const qtyInput = document.getElementById('qtyInput');

    function openDetailModal(id, name, price, imgPath, categoryId, desc) {
        mProductId.value = id;
        mProductName.innerText = name;
        mProductPrice.innerText = price + "円(税込)";
        mProductImg.src = imgPath;
        
        mProductDesc.innerText = desc || "みどり亭こだわりの美味しいメニューです。";

        qtyVal.innerText = "1";
        qtyInput.value = "1";

        // オプション表示の初期化
        const optionContainer = document.getElementById('mProductOptions');
        optionContainer.innerHTML = '';
        document.getElementById('mSelectedOption').value = '';
        document.getElementById('mOptionAddPrice').value = '0';

        // 商品に紐づく有効なオプションをAPI経由でロード
        fetch('/staff/menu/api/product-options?productId=' + id)
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    // 最初のオプションをデフォルト選択
                    const firstOptName = data[0].OPTION_NAME || data[0].option_name;
                    const firstOptAddPrice = data[0].OPTION_ADD_PRICE || data[0].option_add_price || 0;
                    document.getElementById('mSelectedOption').value = firstOptName;
                    document.getElementById('mOptionAddPrice').value = firstOptAddPrice;

                    data.forEach((opt, idx) => {
                        const optName = opt.OPTION_NAME || opt.option_name;
                        const optAddPrice = opt.OPTION_ADD_PRICE || opt.option_add_price || 0;

                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'option-btn' + (idx === 0 ? ' selected' : '');
                        btn.innerText = optAddPrice > 0 ? optName + ' (+' + optAddPrice + '円)' : optName;
                        
                        // スタイリング
                        btn.style.background = 'white';
                        btn.style.border = '2px solid #ccc';
                        btn.style.borderRadius = '8px';
                        btn.style.padding = '10px';
                        btn.style.fontSize = '14px';
                        btn.style.fontWeight = 'bold';
                        btn.style.cursor = 'pointer';
                        
                        if (idx === 0) {
                            btn.style.borderColor = '#E29A13';
                            btn.style.backgroundColor = '#FFFDF5';
                        }

                        btn.onclick = function() {
                            optionContainer.querySelectorAll('button').forEach(b => {
                                b.classList.remove('selected');
                                b.style.borderColor = '#ccc';
                                b.style.backgroundColor = 'white';
                            });
                            btn.classList.add('selected');
                            btn.style.borderColor = '#E29A13';
                            btn.style.backgroundColor = '#FFFDF5';
                            
                            document.getElementById('mSelectedOption').value = optName;
                            document.getElementById('mOptionAddPrice').value = optAddPrice;
                        };
                        
                        optionContainer.appendChild(btn);
                    });
                }
            });

        detailModal.style.display = 'flex';
    }

    function closeDetailModal() {
        detailModal.style.display = 'none';
    }

    function changeQty(diff) {
        let current = parseInt(qtyVal.innerText);
        current += diff;
        if (current < 1) current = 1;
        qtyVal.innerText = current;
        qtyInput.value = current;
    }
</script>
