<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文削除 | みどり亭 スタッフ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #E29A13;
            --primary-hover: #C5830E;
            --bg-color: #F4F5F7;
            --sidebar-bg: #EFEFEF;
            --text-color: #333333;
            --border-color: #DDDDDD;
            --card-green: #00A854;
            --card-red: #F04134;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background-color: #FFFFFF;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 4px solid var(--primary-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary-color);
        }

        .header-logo img {
            height: 35px;
        }

        .header-logo span {
            font-size: 1.25rem;
            font-weight: 700;
            margin-left: 10px;
            font-family: 'Noto Serif JP', serif;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--primary-hover);
        }

        /* メインレイアウト */
        .main-container {
            display: flex;
            margin-top: 60px;
            flex: 1;
        }

        /* サイドバー */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            padding-top: 10px;
            z-index: 90;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            color: #555555;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            border-left: 4px solid transparent;
            font-size: 1.05rem;
        }

        .menu-item:hover {
            background-color: rgba(0,0,0,0.03);
            color: #111111;
        }

        .menu-item.active {
            background-color: #FFFFFF;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            font-weight: 700;
        }

        .menu-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* コンテンツ領域 */
        .content {
            margin-left: 240px;
            padding: 30px;
            flex: 1;
            max-width: calc(100% - 240px);
        }

        /* コンテンツヘッダー */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 日付選択フォーム */
        .date-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .date-selector input[type="date"] {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-color);
            outline: none;
        }

        .btn-update {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-update:hover {
            background-color: var(--primary-hover);
        }

        /* 注文明細テーブル */
        .table-container {
            background-color: #FFFFFF;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .order-table th, .order-table td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .order-table th {
            background-color: var(--primary-color);
            color: #FFFFFF;
            font-weight: 700;
            font-size: 1rem;
        }

        .order-table tbody tr {
            transition: background-color 0.2s;
        }

        .order-table tbody tr:hover {
            background-color: rgba(226, 154, 19, 0.05);
        }

        .order-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* モーダル共通スタイル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #FFFFFF;
            border-radius: 8px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 詳細表示モーダル */
        .modal-header-back {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-back-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-back-icon:hover {
            background-color: var(--primary-hover);
        }

        .modal-body {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .detail-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .detail-price {
            font-size: 1.25rem;
            color: #555555;
            font-weight: 500;
        }

        .detail-img-container {
            width: 150px;
            height: 120px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        /* 数量セレクター */
        .modal-quantity-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 24px;
            background-color: #FAFAFA;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .qty-label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #FFFFFF;
            overflow: hidden;
        }

        .btn-qty {
            width: 48px;
            height: 40px;
            border: none;
            background-color: #F0F0F0;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-qty:hover {
            background-color: #E2E2E2;
        }

        .btn-qty:disabled {
            background-color: #F8F8F8;
            color: #CCCCCC;
            cursor: not-allowed;
        }

        .qty-display {
            width: 60px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* モーダルフッターボタン */
        .modal-footer {
            padding: 20px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background-color: #FFFFFF;
        }

        .btn-modal-action {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-modal-action:hover {
            background-color: var(--primary-hover);
        }

        .btn-modal-cancel {
            background-color: #888888;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-modal-cancel:hover {
            background-color: #777777;
        }

        /* 確認・完了モーダルの独自スタイル */
        .modal-text-content {
            padding: 30px;
            text-align: center;
        }

        .modal-text-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-color);
        }

        .modal-info-list {
            display: inline-block;
            text-align: left;
            margin-bottom: 24px;
            font-size: 1.15rem;
            line-height: 2;
        }

        .modal-info-list div {
            display: flex;
            gap: 20px;
        }

        .modal-info-label {
            font-weight: 700;
            width: 100px;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <a th:href="@{/staff/orders}" class="header-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>みどり亭 管理画面</span>
        </a>
        <a th:href="@{/staff/logout}" class="btn-logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            ログアウト
        </a>
    </header>

    <div class="main-container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <a th:href="@{/staff/orders}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="15" y2="17"></line>
                    </svg>
                </span>
                注文一覧
            </a>
            <a th:href="@{/staff/orders/add}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文追加
            </a>
            <a th:href="@{/staff/orders/delete}" class="menu-item active">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文削除
            </a>
            <a href="#" class="menu-item" onclick="alert('メニュー管理は準備中です')">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </span>
                メニュー管理
            </a>
            <a href="#" class="menu-item" onclick="alert('座席一覧は準備中です')">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19h16v2H4zM4 5h16v12H4z"></path>
                    </svg>
                </span>
                座席一覧
            </a>
        </aside>

        <!-- メインコンテンツ -->
        <main class="content">
            <div class="content-header">
                <h1 class="content-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary-color);">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    注文削除
                </h1>
                
                <!-- 日付選択フォーム -->
                <form method="get" th:action="@{/staff/orders/delete}" class="date-selector">
                    <input type="date" name="date" th:value="${selectedDate}" id="dateInput" onchange="this.form.submit()">
                    <button type="submit" class="btn-update">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                        </svg>
                        更新
                    </button>
                </form>
            </div>

            <!-- 注文明細テーブル -->
            <div class="table-container">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">座席ID</th>
                            <th style="width: 25%;">注文ID</th>
                            <th style="width: 45%;">品名</th>
                            <th style="width: 15%;">数量</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detail : ${orderDetails}" 
                            class="order-row"
                            style="cursor: pointer;"
                            th:data-item-id="${detail.order_detail_id}"
                            th:data-seat-id="${detail.seat_id}"
                            th:data-order-id="${detail.order_id}"
                            th:data-product-name="${detail.product_name}"
                            th:data-option-info="${detail.option_info}"
                            th:data-quantity="${detail.quantity}"
                            th:data-price="${detail.unit_price}"
                            th:data-option-add-price="${detail.option_add_price}"
                            th:data-product-id="${detail.product_id}"
                            onclick="openDetailModal(this)">
                            <td th:text="${detail.seat_id}">1</td>
                            <td th:text="${detail.order_id}">OR0001</td>
                            <td>
                                <span th:text="${detail.product_name}">生ビール（中）</span>
                                <small th:if="${detail.option_info != null && !detail.option_info.isEmpty()}" 
                                       th:text="'（' + ${detail.option_info} + '）'" 
                                       style="color: #666; font-style: italic;"></small>
                            </td>
                            <td th:text="${detail.quantity}">2</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orderDetails)}">
                            <td colspan="4" style="text-align: center; padding: 40px; color: #888;">本日の注文明細はありません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 1. 個数選択・詳細表示モーダル -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <div class="modal-header-back">
                <button type="button" class="btn-back-icon" onclick="closeModal('detailModal')">
                    <!-- 左向き矢印 -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="detail-info">
                    <h2 class="detail-name" id="mProductName">商品名</h2>
                    <p class="detail-price" id="mProductPrice">0円(税込)</p>
                </div>
                <div class="detail-img-container">
                    <img class="detail-img" id="mProductImg" src="/images/no-image.png" alt="商品画像">
                </div>
            </div>
            <!-- 数量セレクター -->
            <div class="modal-quantity-section">
                <span class="qty-label">個数</span>
                <div class="qty-controls">
                    <button type="button" class="btn-qty" id="btnMinus" onclick="changeQty(-1)">−</button>
                    <span class="qty-display" id="mCancelQty">1</span>
                    <button type="button" class="btn-qty" id="btnPlus" onclick="changeQty(1)">+</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal-action" onclick="openConfirmModal()">削除</button>
            </div>
        </div>
    </div>

    <!-- 2. 最終確認ダイアログ -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card" style="max-width: 450px;">
            <div class="modal-text-content">
                <h3 class="modal-text-title">この注文を削除しますか？</h3>
                
                <div class="modal-info-list">
                    <div>
                        <span class="modal-info-label">座席ID</span>
                        <span id="cSeatId">1</span>
                    </div>
                    <div>
                        <span class="modal-info-label">商品名</span>
                        <span id="cProductName">牛串</span>
                    </div>
                    <div>
                        <span class="modal-info-label">個数</span>
                        <span id="cQuantity">3</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="justify-content: center; gap: 20px; padding-bottom: 30px;">
                <button type="button" class="btn-modal-cancel" onclick="closeConfirmModal()">戻る</button>
                <!-- 削除送信フォーム -->
                <form id="deleteForm" method="post" th:action="@{/staff/orders/delete/item}">
                    <input type="hidden" name="orderItemId" id="formItemId">
                    <input type="hidden" name="cancelQuantity" id="formCancelQty">
                    <input type="hidden" name="seatId" id="formSeatId">
                    <input type="hidden" name="productName" id="formProductName">
                    <input type="hidden" name="date" th:value="${selectedDate}">
                    <button type="submit" class="btn-modal-action" style="background-color: var(--primary-color);">削除</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 3. 削除完了ダイアログ -->
    <div class="modal-overlay" id="completeModal" th:style="${showCompleteModal} ? 'display: flex;' : 'display: none;'">
        <div class="modal-card" style="max-width: 450px;">
            <div class="modal-text-content">
                <h3 class="modal-text-title" style="color: var(--text-color);">注文の削除が完了しました</h3>
                
                <div class="modal-info-list">
                    <div>
                        <span class="modal-info-label">座席ID</span>
                        <span th:text="${deletedSeatId}">1</span>
                    </div>
                    <div>
                        <span class="modal-info-label">商品名</span>
                        <span th:text="${deletedProductName}">牛串</span>
                    </div>
                    <div>
                        <span class="modal-info-label">個数</span>
                        <span th:text="${deletedQuantity}">3</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="justify-content: center; padding-bottom: 30px;">
                <button type="button" class="btn-modal-action" onclick="closeModal('completeModal')">確認</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let currentItem = {
            orderDetailId: 0,
            seatId: "",
            orderId: "",
            productName: "",
            optionInfo: "",
            originalQty: 0,
            cancelQty: 1,
            price: 0,
            optionAddPrice: 0,
            productId: ""
        };

        // 詳細モーダルを開く
        function openDetailModal(row) {
            currentItem.orderDetailId = parseInt(row.getAttribute('data-item-id'));
            currentItem.seatId = row.getAttribute('data-seat-id');
            currentItem.orderId = row.getAttribute('data-order-id');
            currentItem.productName = row.getAttribute('data-product-name');
            currentItem.optionInfo = row.getAttribute('data-option-info');
            currentItem.originalQty = parseInt(row.getAttribute('data-quantity'));
            currentItem.price = parseInt(row.getAttribute('data-price'));
            currentItem.optionAddPrice = parseInt(row.getAttribute('data-option-add-price'));
            currentItem.productId = row.getAttribute('data-product-id');
            currentItem.cancelQty = currentItem.originalQty; // デフォルトは全数

            // モーダル表示内容更新
            let displayName = currentItem.productName;
            if (currentItem.optionInfo) {
                displayName += `（${currentItem.optionInfo}）`;
            }
            document.getElementById('mProductName').innerText = displayName;
            
            const totalSinglePrice = currentItem.price + currentItem.optionAddPrice;
            document.getElementById('mProductPrice').innerText = `${totalSinglePrice}円(税込)`;
            
            // 画像パス
            const imgEl = document.getElementById('mProductImg');
            if (currentItem.productId) {
                imgEl.src = `/images/${currentItem.productId}.png`;
            } else {
                imgEl.src = `/images/no-image.png`;
            }
            imgEl.onerror = function() {
                this.src = "/images/no-image.png";
            };

            // 個数コントロールの初期化
            updateQtyDisplay();

            document.getElementById('detailModal').style.display = 'flex';
        }

        // 個数変更処理
        function changeQty(diff) {
            const nextQty = currentItem.cancelQty + diff;
            if (nextQty >= 1 && nextQty <= currentItem.originalQty) {
                currentItem.cancelQty = nextQty;
                updateQtyDisplay();
            }
        }

        // 個数表示更新
        function updateQtyDisplay() {
            document.getElementById('mCancelQty').innerText = currentItem.cancelQty;
            
            // ボタン制御
            document.getElementById('btnMinus').disabled = (currentItem.cancelQty <= 1);
            document.getElementById('btnPlus').disabled = (currentItem.cancelQty >= currentItem.originalQty);
        }

        // 確認モーダルを開く
        function openConfirmModal() {
            document.getElementById('cSeatId').innerText = currentItem.seatId;
            
            let displayName = currentItem.productName;
            if (currentItem.optionInfo) {
                displayName += `（${currentItem.optionInfo}）`;
            }
            document.getElementById('cProductName').innerText = displayName;
            document.getElementById('cQuantity').innerText = currentItem.cancelQty;

            // 送信用フォームに値を設定
            document.getElementById('formItemId').value = currentItem.orderDetailId;
            document.getElementById('formCancelQty').value = currentItem.cancelQty;
            document.getElementById('formSeatId').value = currentItem.seatId;
            document.getElementById('formProductName').value = displayName;

            // 詳細モーダルを隠し、確認モーダルを表示
            document.getElementById('detailModal').style.display = 'none';
            document.getElementById('confirmModal').style.display = 'flex';
        }

        // 確認モーダルから戻る
        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
            document.getElementById('detailModal').style.display = 'flex';
        }

        // モーダルを閉じる
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            
            // 完了ダイアログを閉じた場合は画面をリロード
            if (modalId === 'completeModal') {
                const dateVal = document.getElementById('dateInput').value;
                window.location.href = `/staff/orders/delete?date=${dateVal}`;
            }
        }
    </script>
</body>
</html>
