<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー追加 | みどり亭 スタッフ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #E29A13;
            --primary-hover: #C5830E;
            --bg-color: #F4F5F7;
            --sidebar-bg: #EFEFEF;
            --text-color: #333333;
            --border-color: #DDDDDD;
            --card-green: #00A854;
            --card-red: #F04134;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background-color: #FFFFFF;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 4px solid var(--primary-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary-color);
        }

        .header-logo span {
            font-size: 1.25rem;
            font-weight: 700;
            margin-left: 10px;
            font-family: 'Noto Serif JP', serif;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--primary-hover);
        }

        /* メインレイアウト */
        .main-container {
            display: flex;
            margin-top: 60px;
            flex: 1;
        }

        /* サイドバー */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            padding-top: 10px;
            z-index: 90;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            color: #555555;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            border-left: 4px solid transparent;
            font-size: 1.05rem;
        }

        .menu-item:hover {
            background-color: rgba(0,0,0,0.03);
            color: #111111;
        }

        .menu-item.active {
            background-color: #FFFFFF;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            font-weight: 700;
        }

        .menu-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* コンテンツ領域 */
        .content {
            margin-left: 240px;
            padding: 30px;
            flex: 1;
            max-width: calc(100% - 240px);
        }

        /* コンテンツヘッダー */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            width: 44px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .btn-back:hover {
            background-color: var(--primary-hover);
        }

        /* 追加フォームカード */
        .edit-card {
            background-color: #FFFFFF;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 40px;
            max-width: 850px;
            margin: 0 auto;
        }

        .edit-layout {
            display: flex;
            justify-content: space-between;
            gap: 40px;
        }

        .form-fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: center;
        }

        .form-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333333;
        }

        .form-control-text, .form-control-select, .form-control-textarea {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control-text:focus, .form-control-select:focus, .form-control-textarea:focus {
            border-color: var(--primary-color);
        }

        .form-control-textarea {
            height: 100px;
            resize: none;
        }

        /* 対象コース選択ボタン */
        .course-btn-group {
            display: flex;
            gap: 12px;
        }

        .btn-course-choice {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            background-color: #FFFFFF;
            color: #888888;
            transition: all 0.2s;
        }

        .btn-course-choice.active.standard {
            border-color: #00A2E8;
            background-color: #00A2E8;
            color: #FFFFFF;
        }

        .btn-course-choice.active.premium {
            border-color: #FF7F27;
            background-color: #FF7F27;
            color: #FFFFFF;
            font-style: italic;
        }

        /* トグルスイッチ */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--card-green);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* オプションチェックボックスコンテナ */
        .option-container {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            background-color: #FAFAFA;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            min-height: 54px;
        }

        /* 右側画像セクション */
        .image-aside {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .image-box {
            width: 260px;
            height: 200px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .img-preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .btn-img-change {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-img-change:hover {
            background-color: var(--primary-hover);
        }

        /* 確定アクションボタン */
        .btn-action-yellow {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn-action-yellow:hover {
            background-color: var(--primary-hover);
        }

        /* モーダルポップアップ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #FFFFFF;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            padding: 30px;
            text-align: center;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-modal-cancel {
            background-color: #888888;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-modal-cancel:hover {
            background-color: #777777;
        }

        .btn-modal-action {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-modal-action:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <a th:href="@{/staff/orders}" class="header-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>みどり亭 <span style="font-size: 0.95rem; font-weight: 500; opacity: 0.85;" th:text="${session?.loggedInStoreName != null ? '[' + session?.loggedInStoreName + ']' : ''}"></span></span>
        </a>
        <a th:href="@{/staff/logout}" class="btn-logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            ログアウト
        </a>
    </header>

    <div class="main-container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <a th:href="@{/staff/orders}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="15" y2="17"></line>
                    </svg>
                </span>
                注文一覧
            </a>
            <a th:href="@{/staff/orders/add}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文追加
            </a>
            <a th:href="@{/staff/orders/delete}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                注文削除
            </a>
            <a th:href="@{/staff/menu}" class="menu-item active">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </span>
                メニュー管理
            </a>
            <a th:href="@{/staff/seating}" class="menu-item">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19h16v2H4zM4 5h16v12H4z"></path>
                    </svg>
                </span>
                座席一覧
            </a>
        </aside>

        <!-- メインコンテンツ -->
        <main class="content">
            <div class="content-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <a th:href="@{/staff/menu}" class="btn-back">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </a>
                    <h1 class="content-title">メニュー追加</h1>
                </div>
            </div>

            <!-- 追加カード -->
            <div class="edit-card">
                <form id="addForm" method="post" th:action="@{/staff/menu/add}" enctype="multipart/form-data">
                    <!-- 送信用隠しフィールド -->
                    <input type="hidden" name="productId" value="">
                    <input type="hidden" name="courseId" id="courseIdInput" value="">
                    <input type="hidden" name="imagePath" id="imagePathInput" value="/images/no-image.png">

                    <div class="edit-layout">
                        <!-- 左側入力フィールド -->
                        <div class="form-fields">
                            <div class="form-row">
                                <label class="form-label" for="productName">商品名 :</label>
                                <input type="text" name="productName" id="productName" class="form-control-text" placeholder="商品名を入力してください" required>
                            </div>

                            <div class="form-row">
                                <label class="form-label" for="categoryId">カテゴリー :</label>
                                <select name="categoryId" id="categoryId" class="form-control-select" onchange="onCategoryChange(this.value)">
                                    <option th:each="cat, stat : ${categories}" 
                                            th:value="${cat.category_id}" 
                                            th:text="${cat.category_name}"
                                            th:selected="${stat.index == 0}">お酒</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <label class="form-label" for="price">価格 :</label>
                                <input type="number" name="price" id="price" class="form-control-text" placeholder="価格（税別）を入力" min="0" required>
                            </div>

                            <div class="form-row" style="align-items: flex-start;">
                                <label class="form-label" for="description" style="margin-top: 8px;">商品説明 :</label>
                                <textarea name="description" id="description" class="form-control-textarea" placeholder="商品の説明文を入力してください。"></textarea>
                            </div>

                            <div class="form-row">
                                <label class="form-label">対象コース :</label>
                                <div class="course-btn-group">
                                    <button type="button" class="btn-course-choice standard active" id="btnCourseStandard" onclick="selectCourse('none')">standard</button>
                                    <button type="button" class="btn-course-choice premium" id="btnCoursePremium" onclick="selectCourse('CS01')">premium</button>
                                </div>
                            </div>

                            <div class="form-row">
                                <label class="form-label">季節限定対象 :</label>
                                <label class="switch">
                                    <input type="checkbox" name="seasonalStatusToggle" id="seasonalToggle">
                                    <span class="slider"></span>
                                </label>
                            </div>

                            <div class="form-row">
                                <label class="form-label" for="salesStatus">状態 :</label>
                                <select name="salesStatus" id="salesStatus" class="form-control-select">
                                    <option value="0" selected>販売中</option>
                                    <option value="1">品切れ</option>
                                    <option value="2">販売停止中</option>
                                </select>
                            </div>

                            <div class="form-row" style="align-items: flex-start;">
                                <label class="form-label" style="margin-top: 8px;">オプション :</label>
                                <div class="option-container" id="optionCheckboxes">
                                    <!-- JavaScriptで動的生成 -->
                                    <span style="color: #999; font-style: italic;">カテゴリーを選択してください</span>
                                </div>
                            </div>
                        </div>

                        <!-- 右側画像 -->
                        <div class="image-aside">
                            <div class="image-box">
                                <img class="img-preview" id="imgPreview" src="/images/no-image.png" alt="商品画像" onerror="this.src='/images/no-image.png'">
                            </div>
                            <!-- ファイル選択用の隠しinput -->
                            <input type="file" name="imageFile" id="imageFileInput" accept="image/*" style="display: none;" onchange="previewImage(this)">
                            <button type="button" class="btn-img-change" onclick="document.getElementById('imageFileInput').click()">画像選択</button>
                            
                            <button type="button" class="btn-action-yellow" style="width: 100%; margin-top: auto;" onclick="openConfirmModal()">確定</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- 追加確認モーダル -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card">
            <h3 class="modal-title">この内容で追加しますか？</h3>
            <div class="modal-buttons">
                <button type="button" class="btn-modal-cancel" onclick="closeConfirmModal()">戻る</button>
                <button type="button" class="btn-modal-action" onclick="submitForm()">追加</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // 初期コース状態反映とカテゴリーオプションの自動ロード
        window.onload = function() {
            selectCourse('none');
            const categorySelect = document.getElementById('categoryId');
            if (categorySelect.value) {
                onCategoryChange(categorySelect.value);
            }
        };

        // コース選択トグル
        function selectCourse(courseId) {
            document.getElementById('courseIdInput').value = courseId;
            const btnStd = document.getElementById('btnCourseStandard');
            const btnPrem = document.getElementById('btnCoursePremium');

            btnStd.classList.remove('active');
            btnPrem.classList.remove('active');

            if (courseId === 'none' || courseId === '') {
                btnStd.classList.add('active');
            } else {
                btnPrem.classList.add('active');
            }
        }

        // カテゴリー変更時のオプション動的取得
        function onCategoryChange(categoryId) {
            fetch('/staff/menu/api/options?categoryId=' + categoryId)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('optionCheckboxes');
                    container.innerHTML = '';
                    if (data.length === 0) {
                        container.innerHTML = '<span style="color: #999; font-style: italic;">オプションなし</span>';
                        return;
                    }
                    data.forEach(opt => {
                        const optId = opt.OPTION_ID || opt.option_id;
                        const optName = opt.OPTION_NAME || opt.option_name;
                        const optPrice = opt.OPTION_ADD_PRICE || opt.option_add_price || 0;

                        const label = document.createElement('label');
                        label.style.display = 'flex';
                        label.style.alignItems = 'center';
                        label.style.gap = '8px';
                        label.style.cursor = 'pointer';
                        
                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.name = 'optionIds';
                        cb.value = optId;
                        cb.checked = true; // デフォルトでチェックオン
                        
                        const text = document.createElement('span');
                        text.innerText = optPrice > 0 ? optName + ' (+' + optPrice + '円)' : optName;
                        
                        label.appendChild(cb);
                        label.appendChild(text);
                        container.appendChild(label);
                    });
                });
        }

        // 画像のリアルタイムプレビュー
        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('imagePathInput').value = ""; 
                };
                reader.readAsDataURL(file);
            }
        }

        // 確認モーダル開閉
        function openConfirmModal() {
            // 入力バリデーションのチェック
            const form = document.getElementById('addForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        // フォーム送信
        function submitForm() {
            document.getElementById('addForm').submit();
        }
    </script>
</body>
</html>
