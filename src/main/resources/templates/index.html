<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどり亭 - 注文開始</title>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #fff; }
        .logo-area { text-align: center; margin-bottom: 100px; }
        .logo-text-top { font-size: 32px; color: #333; }
        .logo-main { font-size: 64px; color: #333; font-weight: bold; font-family: 'Hiragino Mincho ProN', serif; }
        .store-name { font-size: 20px; color: #666; margin-top: 10px; }
        .start-btn { background-color: #f3b123; color: white; border: none; padding: 20px 60px; font-size: 28px; font-weight: bold; border-radius: 12px; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="logo-area">
        <div class="logo-text-top">居酒屋</div>
        <div class="logo-main">みどり亭</div>
        
        <div class="store-name" th:text="${storeName}">緑橋一号店</div>
    </div>
    <div th:if="${isBlocked}" style="text-align: center; max-width: 450px; padding: 25px; border: 2px dashed #f04134; border-radius: 12px; background-color: #fff1f0; color: #f04134; font-weight: bold; font-size: 1.1rem; line-height: 1.6; box-shadow: 0 4px 12px rgba(240, 65, 52, 0.1);">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px; color: #f04134; display: inline-block;">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span style="display: block;">このお席は現在ご利用いただけません。</span>
        <span style="display: block; font-size: 0.95rem; font-weight: 500; margin-top: 8px; color: #666;">お手数ですが、スタッフがご案内し席を開設するまでしばらくお待ちください。</span>
    </div>
    
    <a th:if="${!isBlocked}" th:href="@{/seating/members(store_id=${storeId}, seat_id=${seatId})}" class="start-btn">注文開始</a>
</body>
</html>
