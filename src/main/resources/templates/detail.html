<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどり亭 - 商品詳細</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; padding-bottom: 140px; background-color: #f9f9f9; text-align: center; }
        header { background-color: #fff; border-bottom: 3px solid #f3b123; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #f3b123; font-size: 24px; text-decoration: none; }
        header h1 { margin: 0; font-size: 22px; color: #333; }
        .timer { font-size: 14px; text-align: right; color: #333; }

        .detail-container { padding: 20px; background: #fff; margin: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-name { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .product-price { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .product-img { width: 80%; max-width: 300px; height: auto; border-radius: 12px; background-color: #eee; }
        .description { color: #666; font-size: 16px; margin: 20px 0; }

        .selector-section { margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .count-btn { background: none; border: none; font-size: 36px; color: #f3b123; cursor: pointer; }
        .count-num { font-size: 28px; font-weight: bold; width: 50px; }

        /* オプションボタンのスタイル */
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px; }
        .option-btn { background: white; border: 2px solid #ccc; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .option-btn.selected { border-color: #f3b123; background-color: #fffdf5; }

        .add-cart-btn { background-color: #f3b123; color: white; border: none; padding: 15px 60px; font-size: 22px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 10px; width: 80%; }

        /* 共通フッター・ナビ */
        .cart-footer { position: fixed; bottom: 60px; left: 0; width: 100%; background-color: #fff; border-top: 1px solid #ccc; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background-color: #fff; border-top: 2px solid #f3b123; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { text-align: center; color: #666; text-decoration: none; width: 33.3%; font-size: 12px; font-weight: bold; }
        .nav-item.active { color: #f3b123; }
    </style>
</head>
<body>
    <header>
        <a th:href="@{/menu}" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>注文</h1>
        <div class="timer">残り時間<br><strong>01:20:00</strong></div>
    </header>

    <div class="detail-container">
        <h2 class="product-name" th:text="${product.productName}">商品名</h2>
        <div class="product-price" th:text="${product.price} + '円(税込)'">0円</div>
        <img class="product-img" th:src="${product.imagePath}" alt="商品画像" onerror="this.src='/images/no-image.png'">
        
        <p class="description" th:text="${product.description != null && !product.description.isEmpty()} ? ${product.description} : (${product.categoryId == 'CT01'} ? '上手いです。用法用量を守りましょう。' : 'こだわり素材で作りました。出来立てをどうぞ！')"></p>

        <div class="selector-section">
            <span style="font-size: 18px; font-weight: bold;">個数</span>
            <button class="count-btn" onclick="changeCount(-1)"><i class="fas fa-minus-square"></i></button>
            <span class="count-num" id="quantityLabel">1</span>
            <button class="count-btn" onclick="changeCount(1)"><i class="fas fa-plus-square"></i></button>
        </div>

        <div class="option-grid" th:if="${not #lists.isEmpty(options)}">
            <button type="button" 
                    th:each="opt, stat : ${options}" 
                    th:class="${stat.first} ? 'option-btn selected' : 'option-btn'"
                    th:onclick="selectOption([[${opt.option_name}]], [[${opt.option_add_price}]], this)"
                    th:text="${opt.option_add_price > 0} ? ${opt.option_name} + ' (+' + ${opt.option_add_price} + '円)' : ${opt.option_name}">ロック</button>
        </div>

        <form th:action="@{/cart/add}" method="post">
            <input type="hidden" name="productId" th:value="${product.productId}">
            <input type="hidden" name="quantity" id="quantityInput" value="1">
            <input type="hidden" name="selectedOption" id="optionInput" th:value="${not #lists.isEmpty(options)} ? ${options[0].option_name} : 'なし'">
            <input type="hidden" name="optionAddPrice" id="optionPriceInput" th:value="${not #lists.isEmpty(options)} ? ${options[0].option_add_price} : 0">
            
            <button type="submit" class="add-cart-btn">カゴに入れる</button>
        </form>
    </div>

    <div class="cart-footer">
        <div class="total-price" style="font-weight: bold;">合計金額 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ？？？ 円</div>
        <a th:href="@{/cart}" class="add-cart-btn" style="padding: 10px 20px; font-size:16px; width:auto; margin:0; border-radius:8px; text-decoration:none;">カゴを見る</a>    </div>

    <nav class="bottom-nav">
        <a th:href="@{/menu}" class="nav-item active"><i class="fas fa-utensils" style="font-size:20px;"></i><div>注文</div></a>
        <a th:href="@{/orders/history}" class="nav-item"><i class="fas fa-list-alt" style="font-size:20px;"></i><div>注文履歴</div></a>
        <a th:href="@{/orders/billing}" class="nav-item"><i class="fas fa-cash-register" style="font-size:20px;"></i><div>会計</div></a>
    </nav>

    <script>
        let count = 1;
        function changeCount(delta) {
            count = Math.max(1, count + delta);
            document.getElementById('quantityLabel').innerText = count;
            document.getElementById('quantityInput').value = count; // フォームに個数をセット
        }
        function selectOption(name, price, element) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            
            document.getElementById('optionInput').value = name;        // フォームにオプション名をセット
            document.getElementById('optionPriceInput').value = price;  // フォームに加算金額をセット
        }
    </script>
</body>
</html>
