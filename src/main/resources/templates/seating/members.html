<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどり亭 - 人数選択</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fdfdfd; }
        header { background-color: #fff; border-bottom: 3px solid #f3b123; padding: 15px; display: flex; align-items: center; position: relative; }
        header h1 { margin: 0 auto; font-size: 22px; color: #333; }
        .main-content { display: flex; flex-direction: column; align-items: center; padding: 50px 20px; }
        .number-selector { display: flex; align-items: center; gap: 20px; border: 2px solid #ccc; border-radius: 8px; padding: 10px; background-color: #fff; }
        .count-btn { background: none; border: none; font-size: 40px; cursor: pointer; }
        .count-btn.minus { color: #666; }
        .count-btn.plus { color: #f3b123; }
        .count-num { font-size: 40px; color: #333; font-weight: bold; width: 60px; text-align: center; }
        .next-btn { background-color: #f3b123; color: white; border: none; padding: 15px 40px; font-size: 22px; font-weight: bold; border-radius: 8px; margin-top: 50px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>人数選択</h1>
    </header>
    <div class="main-content">
        <div class="number-selector">
            <button class="count-btn minus" id="minusBtn" onclick="changeCount(-1)" disabled style="color: #ccc;"><i class="fas fa-minus-square"></i></button>
            <div class="count-num" id="memberCount">1</div>
            <button class="count-btn plus" id="plusBtn" onclick="changeCount(1)" style="color: #f3b123;"><i class="fas fa-plus-square"></i></button>
        </div>
        <form th:action="@{/seating/course}" method="get" style="width: 100%; text-align: right;">
            <input type="hidden" name="store_id" th:value="${param.store_id}">
            <input type="hidden" name="seat_id" th:value="${param.seat_id}">
            <input type="hidden" name="members" id="membersInput" value="1">
            <button type="submit" class="next-btn">次へ</button>
        </form>
    </div>
    <script>
        function changeCount(delta) {
            let count = parseInt(document.getElementById('memberCount').innerText);
            count = Math.max(1, Math.min(150, count + delta));
            document.getElementById('memberCount').innerText = count;
            document.getElementById('membersInput').value = count;

            // マイナスボタンの制御（1人なら無効化）
            const minusBtn = document.getElementById('minusBtn');
            if (count === 1) {
                minusBtn.disabled = true;
                minusBtn.style.color = "#ccc";
            } else {
                minusBtn.disabled = false;
                minusBtn.style.color = "#f3b123";
            }

            // プラスボタンの制御（150人なら無効化）
            const plusBtn = document.getElementById('plusBtn');
            if (count === 150) {
                plusBtn.disabled = true;
                plusBtn.style.color = "#ccc";
            } else {
                plusBtn.disabled = false;
                plusBtn.style.color = "#f3b123";
            }
        }
    </script>
</body>
<script>
    // ページ読み込み時に履歴を一つ追加して、その場に留まらせる
    history.pushState(null, null, location.href);

    // ユーザーが戻るボタンを押した時のイベント
    window.addEventListener('popstate', function(event) {
        // 再度履歴を追加して進む状態を作る
        history.pushState(null, null, location.href);
        
        // 強制リロードでサーバーに確認させ、インターセプター(門番)を確実に発動させる
        window.location.reload(); 
    });
</script>
</html>
