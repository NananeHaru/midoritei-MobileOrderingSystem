<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどり亭 - QRコードスキャン シミュレーター</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F3B123;
            --primary-gradient: linear-gradient(135deg, #F3B123 0%, #D88E12 100%);
            --bg-gradient: radial-gradient(circle at top right, #1F2026 0%, #111215 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-muted: #A0A5B5;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .simulator-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            background: rgba(243, 177, 35, 0.15);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .control-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 12px;
        }

        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: var(--transition);
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(243, 177, 35, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .qr-display-area {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin: 30px auto;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .qr-display-area:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
        }

        .qr-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .scan-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: var(--primary-gradient);
            color: #111215;
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(243, 177, 35, 0.3);
            transition: var(--transition);
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(243, 177, 35, 0.4);
        }

        .scan-btn:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer-note i {
            color: var(--primary);
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <div class="simulator-card">
        <span class="badge"><i class="fas fa-microchip"></i> Simulator Mode</span>
        <h1>QRコードスキャン シミュレーター</h1>
        <p class="subtitle">座席を選択し、生成されたQRコードをスキャンする（またはボタンをクリックする）ことで、その席の客として注文を開始できます。</p>

        <!-- 店舗選択 -->
        <div class="control-group" style="display: none;">
            <label for="storeSelect">店舗選択</label>
            <div class="select-wrapper">
                <select id="storeSelect" onchange="updateQr()">
                    <option value="01">緑橋一号店</option>
                </select>
            </div>
        </div>

        <!-- 座席選択 -->
        <div class="control-group">
            <label for="seatSelect"><i class="fas fa-chair"></i> 座席選択 (シミュレートする席)</label>
            <div class="select-wrapper">
                <select id="seatSelect" onchange="updateQr()">
                    <option value="1">1番テーブル</option>
                    <option value="2">2番テーブル</option>
                    <option value="3">3番テーブル</option>
                    <option value="4">4番テーブル</option>
                    <option value="5">5番テーブル</option>
                    <option value="6">6番テーブル</option>
                    <option value="7">7番テーブル</option>
                    <option value="8">8番テーブル</option>
                    <option value="9">9番テーブル</option>
                    <option value="10">10番テーブル</option>
                    <option value="11">11番テーブル</option>
                    <option value="12">12番テーブル</option>
                </select>
            </div>
        </div>

        <!-- QRコード表示エリア -->
        <div class="qr-display-area">
            <img id="qrImg" class="qr-img" src="" alt="QR Code">
        </div>

        <!-- スキャン（擬似アクセス）ボタン -->
        <a id="scanLink" href="" class="scan-btn">
            <i class="fas fa-qrcode"></i> このQRコードをスキャンする
        </a>

        <p class="footer-note">
            <i class="fas fa-info-circle"></i> このページは開発およびテスト用です。客側スマホでのQR読み取りによる席開設フローを疑似体験できます。
        </p>
    </div>

    <script>
        function updateQr() {
            const storeId = document.getElementById('storeSelect').value;
            const seatId = document.getElementById('seatSelect').value;
            
            // QRコード画像を動的リクエスト
            const qrImg = document.getElementById('qrImg');
            qrImg.src = `/seating/qr-image?store_id=${storeId}&seat_id=${seatId}`;
            
            // 擬似アクセスボタンのリンク先を動的更新
            const scanLink = document.getElementById('scanLink');
            scanLink.href = `/seating/start?store_id=${storeId}&seat_id=${seatId}`;
        }

        // 初期ロード時に更新を実行
        document.addEventListener('DOMContentLoaded', () => {
            updateQr();
        });
    </script>
</body>
</html>
