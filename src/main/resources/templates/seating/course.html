<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みどり亭 - コース選択</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fdfdfd; }
        header { background-color: #fff; border-bottom: 3px solid #f3b123; padding: 15px; display: flex; align-items: center; }
        header h1 { margin: 0 auto; font-size: 22px; color: #333; }
        .main-content { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .course-btn { width: 100%; border: 3px solid transparent; border-radius: 12px; padding: 25px; color: white; display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 22px; cursor: pointer; }
        .premium { background: linear-gradient(to bottom, #f37023, #d9531a); }
        .standard { background: linear-gradient(to bottom, #00adef, #008cc9); }
        .none { background: linear-gradient(to bottom, #999, #777); font-size: 26px; }
        .next-btn { background-color: #f3b123; color: white; border: none; padding: 15px 40px; font-size: 22px; font-weight: bold; border-radius: 8px; margin-top: 30px; cursor: pointer; align-self: flex-end; }
        /* 詳細エリアのデザイン */
        .details {
            display: none;
            margin-top: -10px; /* ボタンとくっつける */
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 0 0 12px 12px; /* 下側だけ角を丸く */
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .detail-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            text-align: center;
            font-size: 20px;
            cursor: pointer;
            color: #555;
        }
        .detail-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <header>
        <h1>コース選択</h1>
    </header>
    <div class="main-content">
        <form th:action="@{/seating/open}" method="post" style="display: flex; flex-direction: column; gap: 20px;">
            <input type="hidden" name="store_id" th:value="${param.store_id}">
            <input type="hidden" name="seat_id" th:value="${param.seat_id}">
            <input type="hidden" name="members" th:value="${param.members}">
            <input type="hidden" name="course_id" id="courseInput" value="">

            <div class="course-group">
                <button type="button" class="course-btn premium" onclick="toggleDetails('premium-details')">
                    <i class="fas fa-wine-glass-alt"></i> premium コース
                </button>
                <div id="premium-details" class="details">
                    <div class="detail-item" onclick="selectCourse('CS03', this.parentElement.previousElementSibling)">2時間：3500円</div>
                    <div class="detail-item" onclick="selectCourse('CS30', this.parentElement.previousElementSibling)">3時間：4500円</div>
                </div>
            </div>

            <div class="course-group">
                <button type="button" class="course-btn standard" onclick="toggleDetails('standard-details')">
                    <i class="fas fa-beer"></i> standard コース
                </button>
                <div id="standard-details" class="details">
                    <div class="detail-item" onclick="selectCourse('CS02', this.parentElement.previousElementSibling)">2時間：2000円</div>
                    <div class="detail-item" onclick="selectCourse('CS20', this.parentElement.previousElementSibling)">3時間：2500円</div>
                </div>
            </div>

            <button type="button" class="course-btn none" onclick="selectCourse('CS01', this)">
                コースなし
            </button>

            <button type="submit" class="next-btn">次へ</button>
        </form>
    </div>
    
</body>
<script>
    function toggleDetails(id) {
        // すべての details を一度閉じる
        document.querySelectorAll('.details').forEach(el => el.style.display = 'none');
        
        // 押されたIDのみ開く
        const target = document.getElementById(id);
        target.style.display = 'block';
    }

    function selectCourse(courseId, element) {
        // 隠しフィールドにIDをセット
        document.getElementById('courseInput').value = courseId;
        
        // 全ボタン（プレミアム・スタンダード・コースなし）の枠線をリセット
        document.querySelectorAll('.course-btn').forEach(btn => {
            btn.style.border = '3px solid transparent';
        });

        // 押されたのが詳細内の要素(div)か、コースなしボタン(button)かで判定
        if (element) {
            // 詳細アイテムが押された場合、その親ボタンを光らせる
            element.style.border = '5px solid #f3b123';
        } else {
            // コースなしボタンが直接押された場合
            event.currentTarget.style.border = '5px solid #f3b123';
        }
    }
</script>
<script>
    // 1. ページが読み込まれた瞬間に、現在のURLを履歴の「最前列」にセットする
    // これにより、「戻る」ボタンを押したときの遷移先が「現在のページ」自身になります
    history.pushState(null, null, location.href);

    // 2. ブラウザの戻る操作(popstate)を検知して割り込む
    window.addEventListener('popstate', function(event) {
        // 再度履歴を現在のURLで上書きする（戻るのを防ぐ）
        history.pushState(null, null, location.href);
        
        // 3. 強制リロードを実行
        // リロードすることで、サーバー側のインターセプター（門番）が再起動し、
        // 「注文中ならメニュー画面に戻す」というサーバー側のルールを確実に実行させる
        window.location.reload(); 
    });
</script>
</html>
