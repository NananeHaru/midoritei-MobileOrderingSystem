<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

    <div th:fragment="nav-styles">
        <style>
            /* ボタンが画面下のコンテンツに被らないようにする全画面共通の余白 */
            body {
                padding-bottom: 140px !important; 
            }
            .bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 60px;
                background-color: #fff;
                border-top: 2px solid #f3b123;
                display: flex;
                justify-content: space-around;
                align-items: center;
                z-index: 100;
                box-sizing: border-box;
            }
            .nav-item {
                text-align: center;
                color: #666;
                text-decoration: none;
                width: 33.3%;
            }
            .nav-item.active {
                color: #f3b123;
            }
            .nav-icon {
                font-size: 24px;
            }
            .nav-text {
                font-size: 12px;
                margin-top: 3px;
                font-weight: bold;
            }
        </style>
    </div>

    <nav th:fragment="bottom-nav(activePage)" class="bottom-nav">
        <a th:href="@{/menu}" class="nav-item" th:classappend="${activePage == 'menu'} ? 'active' : ''">
            <i class="fas fa-utensils nav-icon"></i>
            <div class="nav-text">注文</div>
        </a>
        <a th:href="@{/orders/history}" class="nav-item" th:classappend="${activePage == 'history'} ? 'active' : ''">
            <i class="fas fa-list-alt nav-icon"></i>
            <div class="nav-text">注文履歴</div>
        </a>
        <a th:href="@{/orders/billing}" class="nav-item" th:classappend="${activePage == 'billing'} ? 'active' : ''">
            <i class="fas fa-cash-register nav-icon"></i>
            <div class="nav-text">会計</div>
        </a>
    </nav>

    <div th:fragment="timer-script">
        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function() {
                let totalSeconds = /*[[${remainingSeconds}]]*/ 7200;
                const timerElement = document.getElementById("countdown-timer");

                if (totalSeconds === -1) {
                    if (timerElement) {
                        timerElement.closest('.timer').textContent = "制限時間なし";
                    }
                    return;
                }

                // 💡 【追加】残り時間が60秒以上ある＝新しい注文（コース）が始まったとみなす
                // その場合は、過去の「アラート出したよフラグ」をきれいに消去（クリア）する
                if (totalSeconds > 60) {
                    sessionStorage.removeItem("timeUpAlertShown");
                }

                function updateTimer() {
                    if (totalSeconds === -1 || totalSeconds === null) {
                        return;
                    }

                    if (totalSeconds <= 0) {
                    if (timerElement) timerElement.textContent = "00:00:00";
                    clearInterval(timerInterval);
                    
                    // 💡 すでにアラートを表示済みかチェックする
                    if (!sessionStorage.getItem("timeUpAlertShown")) {
                        alert("制限時間になりました。ご注文ありがとうございました。");
                        // アラートを出したら「表示済みフラグ」をブラウザに保存する
                        sessionStorage.setItem("timeUpAlertShown", "true");
                    }

                    // ①【メニュー画面】「カゴを見る」ボタンのグレーアウト処理
                    const cartBtn = document.querySelector(".view-cart-btn");
                    if (cartBtn) {
                        cartBtn.style.backgroundColor = "#ccc"; 
                        cartBtn.style.pointerEvents = "none";  
                        cartBtn.textContent = "時間切れ";       
                    }

                    // ②【詳細画面】「カゴに入れる」ボタンをロックする
                    const detailSubmitBtns = document.querySelectorAll("form[action*='/cart/add'] button, form[action*='/cart/add'] input[type='submit'], .add-to-cart-btn");
                    detailSubmitBtns.forEach(btn => {
                        btn.style.backgroundColor = "#ccc";
                        btn.style.pointerEvents = "none";
                        if (btn.tagName === "INPUT") {
                            btn.value = "時間切れ";
                        } else {
                            btn.textContent = "時間切れ";
                        }
                    });

                    // ③【カート画面】「注文を確定する」ボタンをロックする
                    const cartSubmitBtns = document.querySelectorAll("form[action*='/cart/submit'] button, form[action*='/cart/submit'] input[type='submit']");
                    cartSubmitBtns.forEach(btn => {
                        btn.style.backgroundColor = "#ccc";
                        btn.style.pointerEvents = "none";
                        btn.textContent = "時間切れ";
                    });

                    return;
                }
                    
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;

                    let hStr = String(hours).padStart(2, '0');
                    let mStr = String(minutes).padStart(2, '0');
                    let sStr = String(seconds).padStart(2, '0');

                    if (timerElement) {
                        timerElement.textContent = `${hStr}:${mStr}:${sStr}`;
                    }
                    totalSeconds--;
                }
                
                const timerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            });
        </script>
    </div>

</body>
<script>
    // 既存の履歴制御スクリプト（そのまま残しています）
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function(event) {
        history.pushState(null, null, location.href);
        window.location.reload(); 
    });
</script>
</html>
